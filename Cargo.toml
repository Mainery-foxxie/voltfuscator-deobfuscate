[package]
name = "chess-deobf"
version = "0.1.0"
edition = "2024"

[dependencies]
mlua = { version = "0.12.2", features = ["luau", "vendored"] }
serde_json = "1"
sha2 = "0.10"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
tempfile = { version = "3", optional = true }

[features]
bot = ["dep:serenity", "dep:tokio", "dep:reqwest", "dep:tempfile"]

[[bin]]
name = "chess-deobf"
path = "src/main.rs"

[[bin]]
name = "voltfuscator-bot"
path = "src/bin/bot.rs"
required-features = ["bot"]
